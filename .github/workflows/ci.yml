name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Semgrep on Linux only: the Windows job proves the scan degrades
      # cleanly when it is absent, and the Semgrep tests skip themselves.
      - if: runner.os == 'Linux'
        run: pip install semgrep
      - if: runner.os == 'Linux'
        run: |
          semgrep --validate --metrics=off --config src/dpdp_scan/rules/dpdpa.yml
          semgrep --test --metrics=off --config src/dpdp_scan/rules tests/semgrep
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: The CLI installs and runs
        run: dpdp-scan --version
